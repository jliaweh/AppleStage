<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial Web Interface - Prototyp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            background: #000;
        }
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 48px;
            background: rgba(17, 17, 17, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid #e5e5e5;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }

        nav button {
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            padding: 8px 16px;
            transition: color 0.3s;
        }

        nav button:hover {
            color: #ffffff;
        }

        nav button.active {
            color: #ffffff;
            font-weight: 600;
        }

        #canvas-container {
            position: absolute; /* Hinzufügen */
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2; /* Über dem Gradienten */
    }

        .ui-controls {
            position: absolute;
            top: 24px;
            left: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
        }

        .ui-button {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ui-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .info-panel {
            position: absolute;
            bottom: 24px;
            left: 24px;
            right: 24px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            color: white;
            z-index: 100;
        }

        .info-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .info-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 12px;
        }

        .status-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge.active {
            background: rgba(59, 130, 246, 0.3);
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 200;
        }
        .mesh-gradient {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: #050505; /* Tiefschwarze Basis */
  z-index: 0; 
  overflow: hidden;
}

/* Gemeinsame Stile für alle Blobs */
.mesh-gradient div {
  position: absolute;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.6;
  mix-blend-mode: screen; /* Das lässt die Farben wie Licht ineinanderfließen */
}

/* Blaues Licht (Rechts oben) */
.mesh-gradient .blob1 {
  width: 800px;
  height: 800px;
  background: radial-gradient(circle, rgba(74, 144, 226, 0.4) 0%, transparent 70%);
  top: -200px;
  right: -100px;
  animation: move-slow 25s infinite alternate ease-in-out;
}

/* Lila Licht (Links Mitte) */
.mesh-gradient .blob2 {
  width: 700px;
  height: 700px;
  background: radial-gradient(circle, rgba(138, 43, 226, 0.35) 0%, transparent 70%);
  bottom: 100px;
  left: -200px;
  animation: move-slow 30s infinite alternate-reverse ease-in-out;
}

/* Dunkles Cyan (Zentrum) */
.mesh-gradient .blob3 {
  width: 900px;
  height: 600px;
  background: radial-gradient(circle, rgba(26, 153, 167, 0.2) 0%, transparent 70%);
  top: 20%;
  left: 20%;
  animation: drift 40s infinite linear;
}

@keyframes move-slow {
  from { transform: translate(0, 0) scale(1); }
  to { transform: translate(100px, 150px) scale(1.2); }
}

@keyframes drift {
  from { transform: rotate(0deg) translate(50px) rotate(0deg); }
  to { transform: rotate(360deg) translate(50px) rotate(-360deg); }
}
    </style>
</head>
<body>
    <div id="loading" class="loading">Lädt Three.js...</div>
    <div id="canvas-container"></div>

    <div class="mesh-gradient">
        <div class="blob1"></div>
        <div class="blob2"></div>
        <div class="blob3"></div>
    </div>

    <nav>
        <button class="nav-btn active" data-category="Mac">Mac</button>
        <button class="nav-btn" data-category="iPhone">iPhone</button>
        <button class="nav-btn" data-category="iPad">iPad</button>
        <button class="nav-btn" data-category="AirPods">AirPods</button>
    </nav>

    <div class="ui-controls" style="display: none;" id="ui-controls">
        <button class="ui-button" id="btn-reset">
            <span>↻</span> Reset
        </button>
    </div>


    <script type="module" src="./script.js"></script>

</body>
</html>
